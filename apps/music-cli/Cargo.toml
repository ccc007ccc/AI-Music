[package]
name = "music-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "musicctl"
path = "src/main.rs"

[features]
default = ["rustysynth-backend", "sfz-backend"]
rustysynth-backend = ["audio-engine/rustysynth-backend"]
sfz-backend = ["audio-engine/sfz-backend"]

[dependencies]
anyhow = "1"
audio-engine = { path = "../../crates/audio-engine" }
autopilot-engine = { path = "../../crates/autopilot-engine" }
clap = { version = "4", features = ["derive"] }
composition-engine = { path = "../../crates/composition-engine" }
music-core = { path = "../../crates/music-core" }
midi-io = { path = "../../crates/midi-io" }
project-package = { path = "../../crates/project-package" }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
