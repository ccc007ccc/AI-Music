[package]
name = "audio-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
rustysynth-backend = ["dep:rustysynth"]
sfz-backend = ["dep:claxon"]

[dependencies]
cpal = "0.15"
claxon = { version = "0.4.3", optional = true }
hound = "3.5"
music-core = { path = "../music-core" }
rustysynth = { version = "1.3.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
